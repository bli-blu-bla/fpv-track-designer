services:
  fpv-track-designer:
    build:
      context: .
    ports:
      - "8080:80"
    restart: unless-stopped

  pocketbase:
    build:
      context: ./pocketbase
    ports:
      - "8090:8090"
    volumes:
      - pocketbase-data:/pb/pb_data
    restart: unless-stopped

volumes:
  pocketbase-data:
